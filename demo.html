<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Copilot Demo</title><style>
:root{color-scheme:dark;--b:#071018;--p:#0d1b27;--l:#1e3445;--t:#edf5f8;--m:#92a5b5;--c:#4ed7ff;--a:#ffca68}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,sans-serif}.w{max-width:900px;margin:auto;padding:32px 20px}a{color:var(--c)}h1{font-size:clamp(2rem,6vw,4rem);letter-spacing:-.04em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid var(--l);background:var(--p);padding:18px;border-radius:18px}.card strong{font-size:1.5rem}.card span{display:block;color:var(--m);font-size:.85rem}.controls{margin:25px 0;display:grid;gap:14px}.controls label{display:grid;grid-template-columns:1fr auto;gap:8px;color:var(--m)}input{grid-column:1/-1;width:100%;accent-color:var(--c)}.result{border:1px solid var(--l);padding:22px;border-radius:18px;background:#09151f}.result b{color:var(--a);font-size:2rem}.note{color:var(--m);font-size:.88rem}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="w"><p><a href="../../index.html">← PAIVA LAB</a></p><h1>Family Finance Copilot</h1><p class="note">Demo sintética. Nenhum dado financeiro real é usado aqui.</p><div class="grid"><div class="card"><span>Renda líquida</span><strong>R$ 13.500</strong></div><div class="card"><span>Benefício alimentação</span><strong>R$ 950</strong></div></div><div class="controls"><label>Moradia <output id="homeO"></output><input id="home" type="range" min="2000" max="5000" step="50" value="3200"></label><label>Cartão total <output id="cardO"></output><input id="card" type="range" min="500" max="3000" step="50" value="1400"></label><label>Outros fixos/dívidas <output id="fixedO"></output><input id="fixed" type="range" min="1500" max="5000" step="50" value="3500"></label><label>Reserva desejada <output id="reserveO"></output><input id="reserve" type="range" min="0" max="3000" step="100" value="1000"></label></div><section class="result"><span class="note">Sobra depois dos gastos e da reserva</span><br><b id="free"></b><p id="msg"></p></section></main><script>
const ids=['home','card','fixed','reserve'];const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function calc(){ids.forEach(id=>document.getElementById(id+'O').textContent=money(+document.getElementById(id).value));const income=13500;const total=ids.slice(0,3).reduce((s,id)=>s+(+document.getElementById(id).value),0);const reserve=+document.getElementById('reserve').value;const free=income-total-reserve;document.getElementById('free').textContent=money(free);document.getElementById('msg').textContent=free>=0?'Cenário fecha positivo sem usar o benefício alimentação para despesas em dinheiro.':'Cenário estoura o caixa: reduza custo variável, reserva ou renegocie compromissos.';}ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
</script></body></html>
